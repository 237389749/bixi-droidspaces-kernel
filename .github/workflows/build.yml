name: build-bixi-kernel

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Target profile (ROM / kernel)"
        type: choice
        options:
          - "6.6.77-os3.0.304.0"
          - "6.6.118-os4.0.3"
        default: "6.6.77-os3.0.304.0"
      enable_userns:
        description: "Enable CONFIG_USER_NS"
        type: choice
        options: ["0", "1"]
        default: "0"
      kabi_slot_override:
        description: "Override profile kABI slot (optional)"
        required: false
        default: ""

permissions:
  contents: read

env:
  SRC: ${{ github.workspace }}/kernel-src
  DIST: ${{ github.workspace }}/dist

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load profile
        run: |
          set -euo pipefail
          P="$GITHUB_WORKSPACE/profiles/${{ inputs.profile }}"
          test -f "$P/profile.env"
          set -a
          . "$P/profile.env"
          set +a
          if [ -n "${{ inputs.kabi_slot_override }}" ]; then
            KABI_SLOT="${{ inputs.kabi_slot_override }}"
          fi
          {
            echo "PROFILE_DIR=$P"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "KERNEL_REF=$KERNEL_REF"
            echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"
            echo "MANIFEST_BASE_TAG=$MANIFEST_BASE_TAG"
            echo "REPO_FULL=$REPO_FULL"
            echo "KMI_TAG=$KMI_TAG"
            echo "KABI_SLOT=$KABI_SLOT"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "EXPECTED_MODULE_LAYOUT=$EXPECTED_MODULE_LAYOUT"
            echo "EXPECTED_KERNEL_RELEASE=$EXPECTED_KERNEL_RELEASE"
            echo "STRICT_TABLE=$STRICT_TABLE"
            echo "TOLERANT_TABLES=$TOLERANT_TABLES"
          } >> "$GITHUB_ENV"
          cat "$GITHUB_ENV" | tail -20

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo git curl wget python3 python-is-python3 bc bison flex \
            build-essential libssl-dev libelf-dev libncurses-dev openssl \
            lz4 zstd zip unzip rsync cpio dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          pahole --version
          repo --version | head -1

      - name: Sync AOSP GKI source
        run: |
          set -euo pipefail
          git config --global user.name "bixi-ci"
          git config --global user.email "bixi-ci@localhost"

          mkdir -p "$SRC"
          cd "$SRC"

          DEPTH_FLAG="--depth=1"
          if [ "${REPO_FULL:-0}" = "1" ]; then
            DEPTH_FLAG=""
          fi
          repo init $DEPTH_FLAG -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_BRANCH"

          if [ -n "${MANIFEST_BASE_TAG:-}" ]; then
            # Google deletes dated release branches; point the common project
            # at the release tag, otherwise repo sync fails with
            # "couldn't find remote ref refs/heads/android15-6.6-<month>".
            echo "pointing common at refs/tags/$MANIFEST_BASE_TAG"
            sed -i "/name=\"kernel\/common\"/ s|revision=\"[^\"]*\"|revision=\"refs/tags/${MANIFEST_BASE_TAG}\"|" \
              .repo/manifests/default.xml
          fi
          grep -n 'name="kernel/common"' .repo/manifests/default.xml

          repo sync -c -j8 --fail-fast --no-clone-bundle --retry-fetches=3

          if ! git -C common cat-file -e "${KERNEL_REF}^{commit}" 2>/dev/null; then
            echo "fetching $KERNEL_REF"
            git -C common fetch --depth=1 origin "$KERNEL_REF"
          fi
          git -C common checkout --detach "$KERNEL_REF"
          echo "kernel commit: $(git -C common rev-parse HEAD)"
          head -6 common/Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'

      - name: Select AOSP clang
        run: |
          set -euo pipefail
          CLANG_VER=$(grep -m1 '^CLANG_VERSION=' "$SRC/common/build.config.constants" \
            | cut -d= -f2 | tr -d '\r' || true)
          echo "CLANG_VERSION=$CLANG_VER"
          CLANG_DIR=$(find "$SRC/prebuilts/clang/host/linux-x86" \
            -maxdepth 1 -type d -name "clang-${CLANG_VER}" | head -1)
          if [ -z "$CLANG_DIR" ]; then
            CLANG_DIR=$(find "$SRC/prebuilts/clang/host/linux-x86" \
              -maxdepth 1 -type d -name 'clang-r510928' | head -1)
          fi
          if [ -z "$CLANG_DIR" ]; then
            echo "clang-r510928 not found; available:"
            ls "$SRC/prebuilts/clang/host/linux-x86" || true
            exit 1
          fi
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          "$CLANG_DIR/bin/clang" --version | head -2
          "$CLANG_DIR/bin/clang" --version | grep -q 'r510928' \
            || { echo "clang is not r510928; CFI may fail"; exit 1; }

      - name: Apply SYSVIPC kABI patch
        run: |
          set -euo pipefail
          cd "$SRC/common"
          PATCH="$GITHUB_WORKSPACE/patches/001.GKI-below-6.12-fix_sysvipc_kabi_${KABI_SLOT}.patch"
          patch -p1 --forward < "$PATCH"
          grep -n "ANDROID_KABI_USE" include/linux/sched.h | tail -5

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "$SRC/common"
          mkdir -p out
          cp "$PROFILE_DIR/stock.config" out/.config

          # The stock GKI modules are signed by the vendor build key.  Without
          # trusting that key the kernel treats them as vendor modules
          # (sig_ok=false) and rejects their use/export of GKI protected
          # symbols with -EACCES (rfkill, cfg80211, qca, qmi, rmnet...).
          install -D "$PROFILE_DIR/stock_gki_module_signing.pem" \
            "$SRC/common/certs/stock_gki_module_signing.pem"
          scripts/config --file out/.config --set-str SYSTEM_TRUSTED_KEYS \
            "certs/stock_gki_module_signing.pem"

          # plain make does not inject -android15-8-g<hash>-ab<build>, but
          # stock does, and KernelSU/LKM tooling may parse it.
          GHASH=$(git -C "$SRC/common" rev-parse --short=12 HEAD)
          scripts/config --file out/.config --set-str LOCALVERSION \
            "-${KMI_TAG}-g${GHASH}-ab${BUILD_NUMBER}-4k"

          scripts/config --file out/.config \
            -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS -e PID_NS -e DEVTMPFS \
            -e MACVLAN -e IP6_NF_NAT -e IP6_NF_TARGET_MASQUERADE \
            -e NETFILTER_XT_MATCH_ADDRTYPE \
            -d DEVTMPFS_MOUNT -d LOCALVERSION_AUTO -d TRIM_UNUSED_KSYMS

          if [ "${{ inputs.enable_userns }}" = "1" ]; then
            scripts/config --file out/.config -e USER_NS
          fi

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out olddefconfig

          for k in PID_NS IPC_NS SYSVIPC POSIX_MQUEUE DEVTMPFS MACVLAN; do
            grep -q "^CONFIG_$k=y" out/.config || { echo "missing CONFIG_$k"; exit 1; }
          done
          for k in LTO_NONE CFI_CLANG SHADOW_CALL_STACK MODVERSIONS \
                   DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES; do
            grep -q "^CONFIG_$k=y" out/.config || { echo "ABI-critical CONFIG_$k lost"; exit 1; }
          done
          grep -q '^# CONFIG_CFS_BANDWIDTH is not set' out/.config
          grep -q '^# CONFIG_CGROUP_PIDS is not set' out/.config
          grep -q "^CONFIG_LOCALVERSION=\"-${KMI_TAG}-g" out/.config
          # GKI's plain make does not generate abi_symbollist.raw (Kleaf does);
          # modpost then fails. Disable TRIM so Module.symvers does not need it.
          ! grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y' out/.config
          grep -q '^CONFIG_SYSTEM_TRUSTED_KEYRING=y' out/.config
          grep -q '^CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock_gki_module_signing.pem"' out/.config
          grep -q '^CONFIG_MODULE_SIG_PROTECT=y' out/.config

      - name: Build kernel and modules
        run: |
          set -euo pipefail
          cd "$SRC/common"
          sed -i 's/echo "+"//' scripts/setlocalversion 2>/dev/null || true
          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- O=out Image modules
          echo "--- kernel banner ---"
          strings out/arch/arm64/boot/Image | grep -m1 '^Linux version '

      - name: Gate module signing certificate
        run: |
          set -euo pipefail
          FPR=$(cat "$PROFILE_DIR/stock_gki_module_signing.fingerprint")
          python3 "$GITHUB_WORKSPACE/scripts/check_image_certs.py" \
            "$SRC/common/out/arch/arm64/boot/Image" "$FPR"

      - name: Gate vendor symbol CRCs
        run: |
          set -euo pipefail
          cd "$SRC/common"
          echo "--- module_layout (expected ${EXPECTED_MODULE_LAYOUT}) ---"
          grep -w module_layout out/Module.symvers
          grep -q "$(printf '%s\tmodule_layout\t' "$EXPECTED_MODULE_LAYOUT")" out/Module.symvers \
            || { echo "module_layout CRC is not the profile value"; exit 1; }

          if [ -n "${STRICT_TABLE:-}" ]; then
            echo "--- strict: $STRICT_TABLE ---"
            python3 "$GITHUB_WORKSPACE/scripts/check_vendor_crc.py" \
              out/Module.symvers "$GITHUB_WORKSPACE/$STRICT_TABLE"
          else
            echo "--- no strict vendor table for this profile (yet) ---"
          fi

          for t in ${TOLERANT_TABLES:-}; do
            echo "--- tolerant: $t ---"
            python3 "$GITHUB_WORKSPACE/scripts/check_vendor_crc.py" \
              out/Module.symvers "$GITHUB_WORKSPACE/tests/$t.tsv" --allow-missing
          done

      - name: Pack boot image
        run: |
          set -euo pipefail
          cd "$SRC"
          source "$PROFILE_DIR/boot-avb.env"
          BOOT="$DIST/boot-bixi-${PROFILE_NAME}.img"

          MKBOOTIMG=$(find "$SRC" -maxdepth 5 -name mkbootimg.py | head -1)
          AVBTOOL=$(find "$SRC/prebuilts" -maxdepth 8 -name avbtool | head -1)
          UNPACK=$(find "$SRC" -maxdepth 5 -name unpack_bootimg.py | head -1)
          [ -n "$MKBOOTIMG" ] && [ -n "$AVBTOOL" ] && [ -n "$UNPACK" ] || {
            echo "mkbootimg/avbtool not found"; exit 1; }

          mkdir -p "$DIST"
          python3 "$MKBOOTIMG" \
            --header_version 4 \
            --kernel "$SRC/common/out/arch/arm64/boot/Image" \
            --ramdisk /dev/null \
            --cmdline '' \
            --output "$BOOT"

          "$AVBTOOL" add_hash_footer \
            --image "$BOOT" \
            --partition_name boot \
            --partition_size "$PARTITION_SIZE" \
            --algorithm NONE --hash_algorithm sha256 \
            --rollback_index "$ROLLBACK_INDEX" \
            --prop "com.android.build.boot.os_version:$OS_VERSION" \
            --prop "com.android.build.boot.fingerprint:$FINGERPRINT" \
            --prop "com.android.build.boot.security_patch:$SECURITY_PATCH"

          stat -c 'boot image size: %s' "$BOOT"
          test "$(stat -c '%s' "$BOOT")" -eq "$PARTITION_SIZE"
          "$AVBTOOL" info_image --image "$BOOT" \
            | tee "$DIST/GENERATED-BOOT-AVB-INFO.txt"

          python3 "$UNPACK" --boot_img "$BOOT" --out "$DIST/verify"
          cmp "$SRC/common/out/arch/arm64/boot/Image" "$DIST/verify/kernel"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          cp "$SRC/common/out/arch/arm64/boot/Image" "$DIST/Image"
          cp "$SRC/common/out/Module.symvers" "$DIST/Module.symvers"
          diff <(grep -E '^CONFIG_|^# CONFIG_' "$PROFILE_DIR/stock.config" | sort) \
               <(grep -E '^CONFIG_|^# CONFIG_' "$SRC/common/out/.config" | sort) \
               > "$DIST/config.diff" || true
          BOOT="$DIST/boot-bixi-${PROFILE_NAME}.img"

          {
            echo "profile: $PROFILE_NAME"
            echo "kernel ref: $KERNEL_REF"
            echo "manifest branch: $MANIFEST_BRANCH"
            echo "kernel commit: $(git -C "$SRC/common" rev-parse HEAD)"
            echo "kabi slot: $KABI_SLOT"
            echo "enable userns: ${{ inputs.enable_userns }}"
            echo "build number: $BUILD_NUMBER"
            echo "expected release: $EXPECTED_KERNEL_RELEASE"
            echo "clang: $(clang --version | head -1)"
            echo "kernel banner: $(strings "$DIST/Image" | grep -m1 '^Linux version ')"
            echo "module_layout: $(grep -w module_layout "$DIST/Module.symvers")"
            echo "stock cert fingerprint: $(cat "$PROFILE_DIR/stock_gki_module_signing.fingerprint")"
            echo "boot image sha256: $(sha256sum "$BOOT" | cut -d' ' -f1)"
          } > "$DIST/BUILD-INFO.txt"

          cat "$DIST/BUILD-INFO.txt"
          ls -lh "$DIST"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bixi-kernel-${{ inputs.profile }}
          path: |
            dist/
          if-no-files-found: error
          retention-days: 30
